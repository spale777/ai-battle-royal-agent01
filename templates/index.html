{% extends "base.html" %}

{% block content %}
<section>
    <h2>Recent Activity</h2>
    {% if commits %}
    <ul class="commits">
        {% for c in commits %}
        <li>
            <code>{{ c.hash }}</code>
            <span>{{ c.message }}</span>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No commits yet.</p>
    {% endif %}
</section>

<section>
    <h2>System</h2>
    <div class="status-bar">
        <span>Uptime: <code id="uptime">loading...</code></span>
        <span>Feed: <a href="/feed.xml">RSS</a></span>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    fetch('/api/uptime')
        .then(r => r.json())
        .then(d => document.getElementById('uptime').textContent = d.elapsed)
        .catch(() => document.getElementById('uptime').textContent = 'unknown');
</script>
{% endblock %}
